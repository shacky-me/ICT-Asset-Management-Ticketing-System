services:
  - type: web
    name: ictams-server
    runtime: node
    rootDir: server
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: NODE_ENV
        value: production
